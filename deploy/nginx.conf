# Host nginx: /etc/nginx/sites-available/review-hub.ru
# Enable this site, then issue HTTPS: certbot --nginx -d review-hub.ru
server {
    listen 80;
    listen [::]:80;
    server_name review-hub.ru;
    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    location = /api { return 308 /api/; }
    # Expose only application routes; keep metrics and readiness private.
    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:8080/v1/;
    }
    location ^~ /api/ { return 404; }
    location / {
        proxy_pass http://127.0.0.1:8081;
    }
}
