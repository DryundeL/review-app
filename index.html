<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#101413" />
    <!--ssr-head-->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Review Hub",
        "alternateName": ["Ревью Хаб", "review-hub.ru"],
        "url": "https://review-hub.ru/",
        "inLanguage": "ru",
        "description": "Сообщество с обзорами аниме, манги, фильмов и сериалов."
      }
    </script>
    <link rel="stylesheet" href="/auth-loading.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="/telegram-bootstrap.js"></script>
  </head>
  <body>
    <div
      id="telegram-startup"
      class="auth-loading"
      aria-label="Загрузка приложения"
      aria-busy="true"
    >
      <img class="auth-loading__mark" src="/favicon.png" width="72" height="72" alt="" />
      <p class="auth-loading__title" role="status">Готовим ваш Review Hub</p>
      <div class="auth-loading__track" aria-hidden="true"></div>
    </div>
    <div id="root"><!--ssr-outlet--></div>
    <!--ssr-state-->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
