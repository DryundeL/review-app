name: review-app
services:
  app:
    image: review-app:${APP_VERSION:-local}
    build: .
    restart: unless-stopped
    environment:
      SSR_API_BASE_URL: ${SSR_API_BASE_URL:-https://review-hub.ru/api}
    ports:
      - "127.0.0.1:8081:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
